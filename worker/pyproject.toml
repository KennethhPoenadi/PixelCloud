[project]
name = "pixelcloud-worker"
version = "0.1.0"
description = "PixelCloud image processing worker"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2",
    "numpy>=2.1",
    "pillow>=11.0",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker/filters", "worker/pipeline.py"]

[[tool.mypy.overrides]]
module = ["minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
