name: pixelcloud

x-api-env: &api-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_PUBLIC_ENDPOINT: ${PUBLIC_HOST}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL: ${JWT_TTL}
  PRESIGN_TTL: ${PRESIGN_TTL}
  RETENTION_DAYS: ${RETENTION_DAYS}
  USER_RATE_LIMIT_PER_MIN: ${USER_RATE_LIMIT_PER_MIN}

x-api: &api
  build: ./api
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    seed:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

x-worker-env: &worker-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS}
  RECLAIM_IDLE_SECONDS: ${RECLAIM_IDLE_SECONDS}
  CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS}

x-worker: &worker
  build: ./worker
  restart: unless-stopped
  # long enough for the active job to finish after SIGTERM
  stop_grace_period: 75s
  depends_on:
    seed:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api-1:
    <<: *api
    container_name: api-1
    environment:
      <<: *api-env
      NODE_ID: api-1

  api-2:
    <<: *api
    container_name: api-2
    environment:
      <<: *api-env
      NODE_ID: api-2

  worker-1:
    <<: *worker
    container_name: worker-1
    environment:
      <<: *worker-env
      NODE_ID: worker-1

  worker-2:
    <<: *worker
    container_name: worker-2
    environment:
      <<: *worker-env
      NODE_ID: worker-2

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: migrate
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    volumes:
      - ./api/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: postgres:16-alpine
    container_name: seed
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed.sql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./scripts/seed.sql:/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # AOF so queued jobs survive a Redis restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Official MinIO images are no longer published; this is a community build of upstream MinIO.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001" # console, localhost only
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090" # not public
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000" # not public
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
